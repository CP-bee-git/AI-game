    <text x="840" y="562" font-size="19" fill="#E6EAF5">· 修改画像后旧分自动失效</text>
    <rect x="840" y="592" width="330" height="52" rx="10" fill="#1B2A4A" />
    <text x="1005" y="625" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">确定性 = 可复算 = 可信任</text>
