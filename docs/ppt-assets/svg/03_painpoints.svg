<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Noto Sans CJK SC">
  <rect id="bg-03-1" width="1280" height="720" fill="#FBFAF6" data-pptx-role="background" />
  <g id="pain-title" data-pptx-bounds="80 46 600 60">
    <text x="80" y="90" font-size="34" font-weight="bold" fill="#222733">三个不信任</text>
  </g>
  <g id="pain-cards" data-pptx-bounds="80 140 1120 520">
    <g id="pain-card1">
      <rect x="80" y="140" width="350" height="520" rx="18" fill="#FFFFFF" stroke="#D8DCE6" />
      <text x="108" y="196" font-size="24" font-weight="bold" fill="#1B2A4A">编造经历</text>
      <text x="108" y="256" font-size="19" fill="#5D6472">模型替用户“写”简历，</text>
      <text x="108" y="290" font-size="19" fill="#5D6472">团队成果写成个人成果</text>
      <rect x="108" y="470" width="294" height="150" rx="12" fill="#E2F2EF" />
      <text x="128" y="512" font-size="19" font-weight="bold" fill="#128C7E">我们只做事实锁定：</text>
      <text x="128" y="546" font-size="19" fill="#128C7E">每条句子映射</text>
      <text x="128" y="578" font-size="19" fill="#128C7E">已确认事实</text>
    </g>
    <g id="pain-card2">
      <rect x="465" y="140" width="350" height="520" rx="18" fill="#FFFFFF" stroke="#D8DCE6" />
      <text x="493" y="196" font-size="24" font-weight="bold" fill="#1B2A4A">来源不明</text>
      <text x="493" y="256" font-size="19" fill="#5D6472">攻略像聊天回答，</text>
      <text x="493" y="290" font-size="19" fill="#5D6472">无法核对时间与出处</text>
      <rect x="493" y="470" width="294" height="150" rx="12" fill="#E2F2EF" />
      <text x="513" y="512" font-size="19" font-weight="bold" fill="#128C7E">我们给引用与链接：</text>
      <text x="513" y="546" font-size="19" fill="#128C7E">官方来源优先，</text>
      <text x="513" y="578" font-size="19" fill="#128C7E">标注抓取时间</text>
    </g>
    <g id="pain-card3">
      <rect x="850" y="140" width="350" height="520" rx="18" fill="#FFFFFF" stroke="#D8DCE6" />
      <text x="878" y="196" font-size="24" font-weight="bold" fill="#1B2A4A">建议空泛</text>
      <text x="878" y="256" font-size="19" fill="#5D6472">“提升综合素质”</text>
      <text x="878" y="290" font-size="19" fill="#5D6472">无法执行也无法验收</text>
      <rect x="878" y="470" width="294" height="150" rx="12" fill="#E2F2EF" />
      <text x="898" y="512" font-size="19" font-weight="bold" fill="#128C7E">我们给任务清单：</text>
      <text x="898" y="546" font-size="19" fill="#128C7E">动作、产出物、</text>
      <text x="898" y="578" font-size="19" fill="#128C7E">自查标准</text>
    </g>
  </g>
</svg>
