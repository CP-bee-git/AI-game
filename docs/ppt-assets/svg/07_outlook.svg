    <circle cx="60" cy="-46" r="4" fill="#E8A33D"/><circle cx="86" cy="-18" r="3" fill="#7C6FF0"/><circle cx="46" cy="-70" r="3" fill="#4F46C8"/>
  </g>
  <g font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif">
        <g transform="translate(90,230)">
