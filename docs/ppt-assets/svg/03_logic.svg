<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN">
  <rect width="1280" height="720" fill="#f6f5fc"/>
  <text x="90" y="105" font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" letter-spacing="4" fill="#4f46c8">02 · 项目逻辑</text>
  <text x="86" y="172" font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="600" fill="#1b1c2a">一条主线，三个引擎</text>
  <g transform="translate(1120,140)" opacity=".55">
    <circle r="42" fill="none" stroke="#7C6FF0" stroke-width="3"/>
    <circle r="16" fill="none" stroke="#7C6FF0" stroke-width="3"/>
    <path d="M0 -58 v-14 M0 58 v14 M-58 0 h-14 M58 0 h14 M41 -41 l-10 -10 M-41 41 l10 10 M41 41 l-10 10 M-41 -41 l10 -10" stroke="#7C6FF0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46c8"/><stop offset="1" stop-color="#7c6ff0"/></linearGradient>
  </defs>
  <g font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="90" y="230" width="1100" height="74" rx="37" fill="#eeedfb"/>
    <text x="140" y="277" font-size="24" font-weight="600" fill="#3b34a3">简历</text>
    <text x="300" y="277" font-size="24" fill="#3b34a3">→  画像  →  职业方向  →  岗位匹配  →  简历诊断  →  模拟面试  →  可下载报告</text>
    <g transform="translate(90,360)">
      <rect width="350" height="240" rx="20" fill="url(#g1)"/>
      <text x="30" y="58" font-size="24" font-weight="600" fill="#ffffff">理解引擎</text>
      <text x="30" y="100" font-size="18" fill="#dcd9f8">云模型抽取简历要素，</text>
      <text x="30" y="130" font-size="18" fill="#dcd9f8">生成五维星级画像与证据</text>
      <text x="30" y="190" font-size="16" fill="#b9b3ee">OCR · 画像抽取 · 人工确认</text>
    </g>
    <g transform="translate(465,360)">
      <rect width="350" height="240" rx="20" fill="#ffffff" stroke="#e7e6f0"/>
      <text x="30" y="58" font-size="24" font-weight="600" fill="#1b1c2a">匹配引擎</text>
      <text x="30" y="100" font-size="18" fill="#5d6072">55 个官方职业条目 + 岗位规则，</text>
      <text x="30" y="130" font-size="18" fill="#5d6072">输出可解释分数与技能缺口</text>
      <text x="30" y="190" font-size="16" fill="#8a8da0">规则评分 · 不是录用概率</text>
    </g>
    <g transform="translate(840,360)">
      <rect width="350" height="240" rx="20" fill="#ffffff" stroke="#e7e6f0"/>
      <text x="30" y="58" font-size="24" font-weight="600" fill="#1b1c2a">教练引擎</text>
      <text x="30" y="100" font-size="18" fill="#5d6072">针对岗位生成诊断清单，</text>
      <text x="30" y="130" font-size="18" fill="#5d6072">多轮模拟面试逐题评分反馈</text>
      <text x="30" y="190" font-size="16" fill="#8a8da0">诊断 · 面试 · HTML/JSON 报告</text>
    </g>
  </g>
  <text x="90" y="665" font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#5d6072">设计原则：可解释优先、隐私优先（密钥仅存服务端内存）、无 Key 也可用合成样例完整体验</text>
</svg>
