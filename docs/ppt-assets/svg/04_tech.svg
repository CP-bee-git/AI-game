<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN">
  <rect width="1280" height="720" fill="#f6f5fc"/>
  <text x="90" y="105" font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" letter-spacing="4" fill="#4f46c8">03 · 技术架构</text>
  <text x="86" y="172" font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="600" fill="#1b1c2a">前后端分离，云端大模型</text>
  <g transform="translate(1080,130)" opacity=".8">
    <path d="M-70 20 a26 26 0 0 1 4 -51 a34 34 0 0 1 64 -8 a24 24 0 0 1 32 23 a20 20 0 0 1 -6 36 z" fill="#EEEDFB" stroke="#7C6FF0" stroke-width="2.5"/>
    <path d="M-30 20 v24 M0 20 v30 M30 20 v24" stroke="#7C6FF0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-30" cy="52" r="4" fill="#E8A33D"/><circle cx="0" cy="58" r="4" fill="#4F46C8"/><circle cx="30" cy="52" r="4" fill="#7C6FF0"/>
  </g>
  <g font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="90" y="240" width="320" height="300" rx="20" fill="#ffffff" stroke="#e7e6f0"/>
    <rect x="90" y="240" width="320" height="64" rx="20" fill="#4f46c8"/>
    <text x="120" y="281" font-size="23" font-weight="600" fill="#ffffff">前端 · Next.js 16</text>
    <text x="120" y="345" font-size="18" fill="#5d6072">React 19 中文工作台</text>
    <text x="120" y="385" font-size="18" fill="#5d6072">IBM Plex Sans SC 子集字体</text>
    <text x="120" y="425" font-size="18" fill="#5d6072">渐变视觉 + 动效设计</text>
    <text x="120" y="465" font-size="18" fill="#5d6072">响应式：桌面双栏 / 移动单列</text>
    <rect x="480" y="240" width="320" height="300" rx="20" fill="#ffffff" stroke="#e7e6f0"/>
    <rect x="480" y="240" width="320" height="64" rx="20" fill="#3b34a3"/>
    <text x="510" y="281" font-size="23" font-weight="600" fill="#ffffff">后端 · FastAPI</text>
    <text x="510" y="345" font-size="18" fill="#5d6072">Python 3.12+ / SQLite</text>
    <text x="510" y="385" font-size="18" fill="#5d6072">简历解析 PDF / DOCX / 图片</text>
    <text x="510" y="425" font-size="18" fill="#5d6072">会话隔离，Key 不落盘</text>
    <text x="510" y="465" font-size="18" fill="#5d6072">报告导出 HTML / JSON</text>
    <rect x="870" y="240" width="320" height="300" rx="20" fill="#ffffff" stroke="#e7e6f0"/>
    <rect x="870" y="240" width="320" height="64" rx="20" fill="#e8a33d"/>
    <text x="900" y="281" font-size="23" font-weight="600" fill="#ffffff">云模型 · 阿里百炼</text>
    <text x="900" y="345" font-size="18" fill="#5d6072">qwen-plus 文本对话/抽取</text>
    <text x="900" y="385" font-size="18" fill="#5d6072">qwen-vl-plus 图片 OCR</text>
    <text x="900" y="425" font-size="18" fill="#5d6072">中国内地 / 新加坡双节点</text>
    <text x="900" y="465" font-size="18" fill="#5d6072">无需自部署模型</text>
    <path d="M410 390 h70" stroke="#7c6ff0" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M800 390 h70" stroke="#7c6ff0" stroke-width="3" marker-end="url(#arr)"/>
    <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7c6ff0"/></marker></defs>
  </g>
  <g font-family="IBM Plex Sans SC, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="90" y="580" width="1100" height="76" rx="16" fill="#eeedfb"/>
    <text x="120" y="627" font-size="20" fill="#3b34a3">一键启动 ./start.sh 构建并后台运行；cpolar 免费隧道可公网演示；make smoke / check / e2e 三层验证</text>
